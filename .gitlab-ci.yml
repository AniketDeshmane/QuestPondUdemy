stages:
  - package
  - release

variables:
  ZIP_NAME: "questpond-udemy-extension-${CI_COMMIT_SHORT_SHA}.zip"

package-extension:
  stage: package
  image: alpine:latest
  before_script:
    - apk add --no-cache zip jq
  script:
    - VERSION=$(jq -r .version questpond-udemy-extension/manifest.json)
    - echo "Packaging QuestPond Udemy Extension version $VERSION..."
    - cd questpond-udemy-extension
    - zip -r "../$ZIP_NAME" . -x "*.git*"
    - cd ..
  artifacts:
    name: "questpond-udemy-extension-$CI_COMMIT_SHORT_SHA"
    paths:
      - "$ZIP_NAME"
    expire_in: 30 days

release-extension:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "Creating release for $CI_COMMIT_SHORT_SHA..."
  release:
    name: 'Release v1.0.$CI_PIPELINE_IID ($CI_COMMIT_SHORT_SHA)'
    description: 'Automated release ZIP for commit $CI_COMMIT_SHORT_SHA'
    tag_name: 'v1.0.$CI_PIPELINE_IID'
    assets:
      links:
        - name: '$ZIP_NAME'
          url: '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/$ZIP_NAME'
